<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03045e"/>
      <stop offset="0.55" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#sea)"/>

  <!-- bubbles -->
  <g fill="#caf0f8">
    <circle cx="90" cy="260" r="5" opacity="0.5"><animate attributeName="cy" from="270" to="-10" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="260" r="3" opacity="0.4"><animate attributeName="cy" from="270" to="-10" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="260" r="6" opacity="0.35"><animate attributeName="cy" from="270" to="-10" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="260" r="4" opacity="0.45"><animate attributeName="cy" from="270" to="-10" dur="6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="260" r="7" opacity="0.3"><animate attributeName="cy" from="270" to="-10" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="260" r="4" opacity="0.45"><animate attributeName="cy" from="270" to="-10" dur="6.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- back wave -->
  <path fill="#90e0ef" opacity="0.30" d="M0 0 Q62.5 -28 125 0 T250 0 T375 0 T500 0 T625 0 T750 0 T875 0 T1000 0 T1125 0 T1250 0 T1375 0 T1500 0 T1625 0 T1750 0 T1875 0 T2000 0 V90 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 185" to="-1000 185" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- title -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Paniz Olad Hajiali
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#caf0f8" letter-spacing="2">FRONTEND DEVELOPER &amp; TECH ENTHUSIAST
    <animate attributeName="opacity" from="0" to="1" dur="2.2s" fill="freeze"/>
  </text>

  <!-- middle wave -->
  <path fill="#48cae4" opacity="0.45" d="M0 0 Q62.5 -24 125 0 T250 0 T375 0 T500 0 T625 0 T750 0 T875 0 T1000 0 T1125 0 T1250 0 T1375 0 T1500 0 T1625 0 T1750 0 T1875 0 T2000 0 V90 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-1000 205" to="0 205" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- front wave -->
  <path fill="#03045e" opacity="0.85" d="M0 0 Q62.5 -20 125 0 T250 0 T375 0 T500 0 T625 0 T750 0 T875 0 T1000 0 T1125 0 T1250 0 T1375 0 T1500 0 T1625 0 T1750 0 T1875 0 T2000 0 V90 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 228" to="-1000 228" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
